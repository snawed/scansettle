name: Terraform (non-prod)

# Deliberately NOT run on every push — infrastructure changes should be
# reviewed as a plan before anyone applies them. Run manually from the
# Actions tab (workflow_dispatch), or open a PR touching
# infra/terraform/nonprod/** to see a plan in the PR before merging.
on:
  workflow_dispatch:
    inputs:
      action:
        description: "plan or apply"
        required: true
        default: "plan"
        type: choice
        options: [plan, apply]
  pull_request:
    paths:
      - "infra/terraform/nonprod/**"
      - ".github/workflows/terraform-nonprod.yml"

permissions:
  id-token: write # required for OIDC — see infra/aws-bootstrap/bootstrap.sh
  contents: read
  pull-requests: write # to comment the plan on a PR

jobs:
  terraform:
    name: Terraform ${{ github.event.inputs.action || 'plan' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform/nonprod

    steps:
      - uses: actions/checkout@v4

      # TEMPORARY — one more diagnostic round: check the secret isn't subtly
      # corrupted (length/hash only, never the value itself) and get AWS's own
      # raw error from a manual, untagged assume-role-with-web-identity call,
      # since the wrapped action's error has stayed identical through every
      # config fix so far. Remove once this is resolved.
      - name: Debug — verify secret and try a raw, untagged assume-role
        env:
          ROLE_ARN: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
        run: |
          echo "Role ARN length: ${#ROLE_ARN}"
          echo -n "$ROLE_ARN" | md5sum

          TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" | jq -r .value)
          PAYLOAD=$(echo "$TOKEN" | cut -d '.' -f2)
          MOD=$(( ${#PAYLOAD} % 4 ))
          if [ "$MOD" -eq 2 ]; then PAYLOAD="${PAYLOAD}=="; elif [ "$MOD" -eq 3 ]; then PAYLOAD="${PAYLOAD}="; fi
          echo "$PAYLOAD" | tr '_-' '/+' | base64 -d | jq '{sub, aud, iss, repository, repository_owner, ref, event_name}'

          echo "--- Raw, untagged assume-role-with-web-identity ---"
          aws sts assume-role-with-web-identity \
            --role-arn "$ROLE_ARN" \
            --role-session-name "debug-test" \
            --web-identity-token "$TOKEN" \
            --duration-seconds 900 2>&1 || true

      - name: Configure AWS credentials (OIDC — no stored keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-skip-session-tagging: true

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Terraform init
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=nonprod/terraform.tfstate" \
            -backend-config="region=${{ vars.AWS_REGION }}" \
            -backend-config="dynamodb_table=${{ vars.TF_LOCK_TABLE }}"

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        id: plan
        run: terraform plan -no-color -var="tf_state_bucket=${{ vars.TF_STATE_BUCKET }}" -var="aws_region=${{ vars.AWS_REGION }}" -out=tfplan
        continue-on-error: true

      - name: Comment plan on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const output = `#### Terraform Plan\n\`\`\`\n${{ steps.plan.outputs.stdout }}\n\`\`\``;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output.slice(0, 65000),
            });

      - name: Fail the job if plan failed
        if: steps.plan.outcome == 'failure'
        run: exit 1

      - name: Terraform apply
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'apply'
        run: terraform apply -auto-approve tfplan

      - name: Show outputs
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'apply'
        run: terraform output
