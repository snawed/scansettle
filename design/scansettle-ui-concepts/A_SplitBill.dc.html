<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
  *{box-sizing:border-box;}
  body{margin:0;}
  .root{font-family:'Manrope',system-ui,sans-serif;background:#FFFFFF;color:#0B0F19;width:390px;height:844px;overflow:hidden;display:flex;flex-direction:column;padding:28px 24px;}
  .opt{border:1.5px solid #EFF0F3;border-radius:14px;padding:18px;margin-bottom:12px;}
  .opt.selected{border-color:#2454FF;background:#F5F7FF;}
  .btn-primary{background:#2454FF;color:#fff;border:none;border-radius:12px;padding:17px 22px;font-weight:700;font-size:16px;font-family:inherit;cursor:pointer;width:100%;}
</style>
</helmet>
<div class="root">
  <div style="font-size:12px;color:#9CA3AF;font-weight:700;margin-bottom:4px;">← Table 14 · The Red Lion</div>
  <div style="font-size:22px;font-weight:800;letter-spacing:-0.02em;margin-bottom:4px;">How much are you paying?</div>
  <div style="font-size:14px;color:#6B7280;margin-bottom:24px;">Remaining balance: £60.00</div>

  <div style="flex:1;">
    <div class="opt selected">
      <div class="row" style="display:flex;justify-content:space-between;align-items:center;">
        <div>
          <div style="font-weight:800;font-size:15px;">Split equally</div>
          <div style="font-size:13px;color:#6B7280;margin-top:2px;">3 people · £20.00 each</div>
        </div>
        <div style="width:20px;height:20px;border-radius:100px;background:#2454FF;"></div>
      </div>
    </div>

    <div class="opt">
      <div style="font-weight:800;font-size:15px;">Pay full remaining</div>
      <div style="font-size:13px;color:#6B7280;margin-top:2px;">£60.00</div>
    </div>

    <div class="opt">
      <div style="font-weight:800;font-size:15px;margin-bottom:10px;">Custom amount</div>
      <div style="position:relative;">
        <span style="position:absolute;left:14px;top:12px;color:#9CA3AF;font-size:15px;">£</span>
        <input placeholder="0.00" style="width:100%;border:1px solid #E1E3E8;border-radius:10px;padding:12px 16px 12px 28px;font-family:inherit;font-size:15px;background:#FBFBFC;">
      </div>
    </div>
  </div>

  <button class="btn-primary">Continue — £20.00</button>
</div>
</x-dc>
</body>
</html>
