<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
  *{box-sizing:border-box;}
  body{margin:0;}
  .root{font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:#F7F4EE;color:#151312;width:390px;height:844px;overflow:hidden;display:flex;flex-direction:column;padding:30px 26px;}
  .serif{font-family:'Instrument Serif',serif;}
  .pill{flex:1;text-align:center;padding:17px 0;border-radius:100px;background:#fff;font-weight:800;font-size:15px;box-shadow:0 8px 20px -14px rgba(14,27,51,0.2);}
  .pill.selected{background:linear-gradient(135deg,#C9A227,#E7CE7A);color:#0E1B33;}
  .btn-primary{background:linear-gradient(135deg,#C9A227,#E7CE7A);color:#0E1B33;border:none;border-radius:100px;padding:18px 22px;font-weight:800;font-size:16px;font-family:inherit;cursor:pointer;width:100%;}
</style>
</helmet>
<div class="root">
  <div style="font-size:12px;color:#8B8478;font-weight:700;margin-bottom:4px;">← Table 14 · The Red Lion</div>
  <div class="serif" style="font-size:30px;margin-bottom:28px;">Add a tip?</div>

  <div style="flex:1;">
    <div style="display:flex;gap:10px;margin-bottom:28px;">
      <div class="pill">No tip</div>
      <div class="pill">5%</div>
      <div class="pill selected">10%</div>
      <div class="pill">Custom</div>
    </div>

    <div style="background:#fff;border-radius:18px;padding:22px;box-shadow:0 12px 30px -20px rgba(14,27,51,0.18);">
      <div style="display:flex;justify-content:space-between;font-size:15px;color:#8B8478;padding:6px 0;"><span>Your share</span><span>£20.00</span></div>
      <div style="display:flex;justify-content:space-between;font-size:15px;color:#8B8478;padding:6px 0;"><span>Tip (10%)</span><span>£2.00</span></div>
      <div style="border-top:1px dashed #E5DFCF;margin:8px 0;"></div>
      <div class="serif" style="display:flex;justify-content:space-between;font-size:26px;"><span>Total</span><span>£22.00</span></div>
    </div>
  </div>

  <button class="btn-primary">Pay by Bank — £22.00</button>
</div>
</x-dc>
</body>
</html>
