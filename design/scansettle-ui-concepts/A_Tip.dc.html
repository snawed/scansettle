<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
  *{box-sizing:border-box;}
  body{margin:0;}
  .root{font-family:'Manrope',system-ui,sans-serif;background:#FFFFFF;color:#0B0F19;width:390px;height:844px;overflow:hidden;display:flex;flex-direction:column;padding:28px 24px;}
  .pill{flex:1;text-align:center;padding:16px 0;border-radius:12px;border:1.5px solid #EFF0F3;font-weight:800;font-size:15px;}
  .pill.selected{background:#0B0F19;color:#fff;border-color:#0B0F19;}
  .btn-primary{background:#2454FF;color:#fff;border:none;border-radius:12px;padding:17px 22px;font-weight:700;font-size:16px;font-family:inherit;cursor:pointer;width:100%;}
</style>
</helmet>
<div class="root">
  <div style="font-size:12px;color:#9CA3AF;font-weight:700;margin-bottom:4px;">← Table 14 · The Red Lion</div>
  <div style="font-size:22px;font-weight:800;letter-spacing:-0.02em;margin-bottom:28px;">Add a tip?</div>

  <div style="flex:1;">
    <div style="display:flex;gap:10px;margin-bottom:28px;">
      <div class="pill">No tip</div>
      <div class="pill">5%</div>
      <div class="pill selected">10%</div>
      <div class="pill">Custom</div>
    </div>

    <div style="border-top:1px solid #EFF0F3;padding-top:20px;">
      <div style="display:flex;justify-content:space-between;font-size:15px;color:#6B7280;padding:6px 0;"><span>Your share</span><span>£20.00</span></div>
      <div style="display:flex;justify-content:space-between;font-size:15px;color:#6B7280;padding:6px 0;"><span>Tip (10%)</span><span>£2.00</span></div>
      <div style="display:flex;justify-content:space-between;font-size:22px;font-weight:800;padding-top:14px;border-top:1px solid #EFF0F3;margin-top:10px;"><span>Total</span><span>£22.00</span></div>
    </div>
  </div>

  <button class="btn-primary">Pay by Bank — £22.00</button>
</div>
</x-dc>
</body>
</html>
