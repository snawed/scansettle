<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
  *{box-sizing:border-box;}
  body{margin:0;}
  .root{font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:#F7F4EE;color:#151312;width:390px;height:844px;overflow:hidden;display:flex;flex-direction:column;padding:30px 26px;}
  .serif{font-family:'Instrument Serif',serif;}
  .opt{background:#fff;border-radius:18px;padding:20px;margin-bottom:12px;box-shadow:0 12px 30px -20px rgba(14,27,51,0.18);}
  .opt.selected{box-shadow:0 0 0 2px #C9A227,0 12px 30px -20px rgba(14,27,51,0.18);}
  .btn-primary{background:linear-gradient(135deg,#C9A227,#E7CE7A);color:#0E1B33;border:none;border-radius:100px;padding:18px 22px;font-weight:800;font-size:16px;font-family:inherit;cursor:pointer;width:100%;}
</style>
</helmet>
<div class="root">
  <div style="font-size:12px;color:#8B8478;font-weight:700;margin-bottom:4px;">← Table 14 · The Red Lion</div>
  <div class="serif" style="font-size:30px;margin-bottom:4px;">How much are you paying?</div>
  <div style="font-size:14px;color:#8B8478;margin-bottom:24px;">Remaining balance: £60.00</div>

  <div style="flex:1;">
    <div class="opt selected">
      <div style="display:flex;justify-content:space-between;align-items:center;">
        <div><div style="font-weight:800;font-size:15px;">Split equally</div><div style="font-size:13px;color:#8B8478;margin-top:2px;">3 people · £20.00 each</div></div>
        <div style="width:22px;height:22px;border-radius:100px;background:linear-gradient(135deg,#C9A227,#E7CE7A);"></div>
      </div>
    </div>
    <div class="opt"><div style="font-weight:800;font-size:15px;">Pay full remaining</div><div style="font-size:13px;color:#8B8478;margin-top:2px;">£60.00</div></div>
    <div class="opt">
      <div style="font-weight:800;font-size:15px;margin-bottom:10px;">Custom amount</div>
      <div style="position:relative;">
        <span style="position:absolute;left:14px;top:12px;color:#8B8478;font-size:15px;">£</span>
        <input placeholder="0.00" style="width:100%;border:1.5px solid #EDE7DA;border-radius:12px;padding:12px 16px 12px 28px;font-family:inherit;font-size:15px;background:#FBF9F5;">
      </div>
    </div>
  </div>

  <button class="btn-primary">Continue — £20.00</button>
</div>
</x-dc>
</body>
</html>
