  body{margin:0;}
  .root{font-family:'Manrope',system-ui,sans-serif;background:#FFFFFF;color:#0B0F19;width:390px;height:844px;overflow:hidden;display:flex;flex-direction:column;padding:28px 24px;}

<div class="root">

  <div style="font-size:22px;font-weight:800;letter-spacing:-0.02em;">The Red Lion</div>
  <div style="font-size:14px;color:#6B7280;font-weight:600;margin-bottom:24px;">Table 14</div>

    <div class="item-row" style="font-weight:800;font-size:22px;padding-top:4px;"><span>Remaining</span><span>£60.00</span></div>

  <button class="btn-primary">Pay by Bank</button>
