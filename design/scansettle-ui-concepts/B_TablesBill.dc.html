<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
  *{box-sizing:border-box;}
  body{margin:0;}
  .root{font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:#F7F4EE;color:#151312;width:390px;height:844px;overflow:hidden;display:flex;flex-direction:column;padding:30px 26px;}
  .serif{font-family:'Instrument Serif',serif;}
  .item-row{display:flex;justify-content:space-between;padding:9px 0;font-size:15px;color:#5A5346;}
  .btn-primary{background:linear-gradient(135deg,#C9A227,#E7CE7A);color:#0E1B33;border:none;border-radius:100px;padding:18px 22px;font-weight:800;font-size:16px;font-family:inherit;cursor:pointer;width:100%;}
</style>
</helmet>
<div class="root">
  <div style="font-size:11px;color:#C9A227;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;margin-bottom:6px;">ScanSettle Tables</div>
  <div class="serif" style="font-size:32px;margin-bottom:2px;">The Red Lion</div>
  <div style="font-size:14px;color:#8B8478;font-weight:600;margin-bottom:26px;">Table 14</div>

  <div style="flex:1;overflow:auto;">
    <div style="background:#fff;border-radius:18px;padding:22px;box-shadow:0 12px 30px -18px rgba(14,27,51,0.2);">
      <div class="item-row"><span>Food</span><span>£48.00</span></div>
      <div class="item-row"><span>Drinks</span><span>£27.00</span></div>
      <div class="item-row"><span>Dessert</span><span>£15.00</span></div>
      <div style="border-top:1px dashed #E5DFCF;margin:10px 0;"></div>
      <div class="item-row" style="font-weight:800;font-size:17px;color:#151312;"><span>Total</span><span>£90.00</span></div>
    </div>

    <div style="display:flex;justify-content:space-between;padding:22px 4px 6px;font-size:14px;color:#8B8478;"><span>Already paid</span><span>£30.00</span></div>
    <div class="serif" style="display:flex;justify-content:space-between;padding:2px 4px;font-size:30px;"><span>Remaining</span><span>£60.00</span></div>
  </div>

  <button class="btn-primary">Pay by Bank</button>
</div>
</x-dc>
</body>
</html>
