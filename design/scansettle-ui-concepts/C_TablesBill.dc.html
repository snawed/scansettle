<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  *{box-sizing:border-box;}
  body{margin:0;}
  .root{font-family:'IBM Plex Sans',system-ui,sans-serif;background:#fff;color:#12141A;width:390px;height:844px;overflow:hidden;display:flex;flex-direction:column;padding:22px 20px;}
  .mono{font-family:'IBM Plex Mono',monospace;}
  .item-row{display:flex;justify-content:space-between;padding:8px 0;font-size:14px;color:#5B616E;}
  .btn{background:#0F62FE;color:#fff;border:none;border-radius:6px;padding:15px 20px;font-weight:700;font-size:15px;font-family:inherit;cursor:pointer;width:100%;}
</style>
</helmet>
<div class="root">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:2px;">
    <div style="font-size:10px;color:#0F62FE;font-weight:700;letter-spacing:0.06em;">SCANSETTLE TABLES</div>
    <div class="mono" style="font-size:10px;color:#5B616E;">TABLE 14</div>
  </div>
  <div style="font-size:20px;font-weight:700;margin-bottom:20px;">The Red Lion</div>

  <div style="flex:1;overflow:auto;">
    <div style="border:1px solid #E1E4E9;border-radius:6px;padding:16px;">
      <div class="item-row"><span>Food</span><span class="mono">£48.00</span></div>
      <div class="item-row"><span>Drinks</span><span class="mono">£27.00</span></div>
      <div class="item-row"><span>Dessert</span><span class="mono">£15.00</span></div>
      <div class="item-row" style="border-top:1px solid #E1E4E9;margin-top:6px;padding-top:12px;font-weight:700;color:#12141A;font-size:15px;"><span>Total</span><span class="mono">£90.00</span></div>
    </div>

    <div style="display:flex;justify-content:space-between;padding:16px 4px 4px;font-size:13px;color:#5B616E;"><span>Already paid</span><span class="mono">£30.00</span></div>
    <div style="display:flex;justify-content:space-between;padding:2px 4px;font-size:24px;font-weight:700;"><span>Remaining</span><span class="mono">£60.00</span></div>
  </div>

  <button class="btn">Pay by Bank</button>
</div>
</x-dc>
</body>
</html>
